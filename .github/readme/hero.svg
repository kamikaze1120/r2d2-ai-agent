<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">R2D2 — local-first AI agent</title>
  <desc id="desc">Animated night-sky banner with a golden astromech droid dome, orbiting rings, chat bubbles and the R2D2 title in gold.</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#020317"/>
      <stop offset=".52" stop-color="#071238"/>
      <stop offset="1" stop-color="#13052d"/>
    </linearGradient>
    <radialGradient id="purpleCloud">
      <stop stop-color="#d43cff" stop-opacity=".7"/>
      <stop offset=".34" stop-color="#8d22ff" stop-opacity=".32"/>
      <stop offset="1" stop-color="#4215a7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueCloud">
      <stop stop-color="#5fc8ff" stop-opacity=".5"/>
      <stop offset=".35" stop-color="#2a7bff" stop-opacity=".2"/>
      <stop offset="1" stop-color="#0b2a8a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#a96b18"/>
      <stop offset=".28" stop-color="#ffe293"/>
      <stop offset=".55" stop-color="#f4bb4d"/>
      <stop offset=".82" stop-color="#fff0b7"/>
      <stop offset="1" stop-color="#b87519"/>
    </linearGradient>
    <linearGradient id="dome" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fff4cf"/>
      <stop offset=".45" stop-color="#d9dcef"/>
      <stop offset="1" stop-color="#7d86b3"/>
    </linearGradient>
    <radialGradient id="eye">
      <stop stop-color="#e9f8ff"/>
      <stop offset=".35" stop-color="#5fc8ff"/>
      <stop offset="1" stop-color="#0c2f7a"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff" stop-opacity=".14"/>
      <stop offset=".45" stop-color="#af75ff" stop-opacity=".07"/>
      <stop offset="1" stop-color="#f6c35b" stop-opacity=".05"/>
    </linearGradient>
    <pattern id="stars" width="150" height="110" patternUnits="userSpaceOnUse">
      <circle cx="13" cy="18" r="1.2" fill="#fff7d4" opacity=".9"/>
      <circle cx="61" cy="36" r=".7" fill="#d7b5ff" opacity=".76"/>
      <circle cx="112" cy="17" r=".9" fill="#fff" opacity=".72"/>
      <circle cx="140" cy="68" r="1.1" fill="#ffd972" opacity=".8"/>
      <circle cx="83" cy="91" r=".55" fill="#fff" opacity=".58"/>
      <circle cx="31" cy="100" r=".75" fill="#8fd6ff" opacity=".78"/>
    </pattern>
    <filter id="blur" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="42"/></filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dy="18" stdDeviation="20" flood-color="#000017" flood-opacity=".8"/></filter>
    <clipPath id="clip"><rect width="1200" height="420" rx="34"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="420" fill="url(#night)"/>
    <ellipse cx="260" cy="130" rx="340" ry="210" fill="url(#purpleCloud)" filter="url(#blur)">
      <animate attributeName="rx" values="310;380;310" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".65;1;.65" dur="9s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="960" cy="250" rx="300" ry="200" fill="url(#blueCloud)" filter="url(#blur)">
      <animate attributeName="ry" values="175;235;175" dur="16s" repeatCount="indefinite"/>
    </ellipse>
    <rect x="-150" width="1500" height="520" fill="url(#stars)" opacity=".78">
      <animateTransform attributeName="transform" type="translate" values="0 0;150 0" dur="46s" repeatCount="indefinite"/>
    </rect>

    <!-- droid dome + orbits -->
    <g transform="translate(940 226)">
      <circle r="150" fill="none" stroke="#f7c758" stroke-width="1.5" stroke-dasharray="4 12" opacity=".6">
        <animateTransform attributeName="transform" type="rotate" values="0;360" dur="30s" repeatCount="indefinite"/>
      </circle>
      <circle r="186" fill="none" stroke="#bc52ff" stroke-width="1" stroke-dasharray="2 14" opacity=".5">
        <animateTransform attributeName="transform" type="rotate" values="360;0" dur="40s" repeatCount="indefinite"/>
      </circle>
      <ellipse rx="210" ry="50" fill="none" stroke="url(#gold)" stroke-width="2.5" transform="rotate(-14)" opacity=".75"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0;360" dur="18s" repeatCount="indefinite"/>
        <circle cx="150" cy="0" r="6" fill="#ffd66f" filter="url(#glow)"/>
      </g>
      <!-- dome -->
      <path d="M-96 34A96 96 0 0 1 96 34Z" fill="url(#dome)" stroke="url(#gold)" stroke-width="3" filter="url(#glow)"/>
      <path d="M-96 34A96 96 0 0 1 96 34" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1"/>
      <rect x="-96" y="34" width="192" height="12" rx="4" fill="#B17A23"/>
      <rect x="-72" y="-6" width="34" height="18" rx="3" fill="#2a4fb8" opacity=".9"/>
      <rect x="40" y="-6" width="30" height="18" rx="3" fill="#2a4fb8" opacity=".9"/>
      <rect x="-30" y="-44" width="60" height="10" rx="3" fill="#2a4fb8" opacity=".85"/>
      <circle cx="0" cy="-2" r="20" fill="#0a1440" stroke="#F4C65A" stroke-width="2"/>
      <circle cx="0" cy="-2" r="12" fill="url(#eye)" filter="url(#glow)">
        <animate attributeName="r" values="10;14;10" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="58" cy="-34" r="5" fill="#ff5a6e" filter="url(#glow)">
        <animate attributeName="opacity" values=".2;1;.2" dur="1.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-58" cy="-30" r="4" fill="#5fc8ff" filter="url(#glow)">
        <animate attributeName="opacity" values="1;.3;1" dur="2.2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- chat bubbles -->
    <g opacity=".95">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="6s" repeatCount="indefinite"/>
      <rect x="1012" y="62" width="150" height="40" rx="14" fill="#160f38" fill-opacity=".85" stroke="#d34cff" stroke-opacity=".7"/>
      <path d="M1030 102l-8 12 20-12z" fill="#160f38" stroke="#d34cff" stroke-opacity=".7"/>
      <text x="1028" y="87" fill="#f0d7ff" font-family="'JetBrains Mono', Consolas, monospace" font-size="12">At your service.</text>
    </g>
    <g opacity=".95">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 5;0 0" dur="7s" repeatCount="indefinite"/>
      <rect x="742" y="330" width="170" height="40" rx="14" fill="#1d1732" fill-opacity=".85" stroke="#f3c454" stroke-opacity=".65"/>
      <text x="758" y="355" fill="#ffe7a2" font-family="'JetBrains Mono', Consolas, monospace" font-size="12">plan → tool → observe</text>
    </g>

    <!-- identity panel -->
    <g filter="url(#shadow)">
      <rect x="56" y="52" width="640" height="316" rx="28" fill="#060a25" fill-opacity=".58" stroke="url(#gold)" stroke-opacity=".82"/>
      <rect x="68" y="64" width="616" height="292" rx="22" fill="url(#glass)" stroke="#d38cff" stroke-opacity=".26"/>
    </g>
    <path d="M96 100H300" stroke="url(#gold)" stroke-width="2"/>
    <circle cx="96" cy="100" r="5" fill="#ffd66f" filter="url(#glow)">
      <animate attributeName="opacity" values=".3;1;.3" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="114" y="106" fill="#f9d777" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" letter-spacing="3">AGENT CORE / LOCALHOST:8000</text>
    <text x="94" y="200" fill="url(#gold)" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="92" font-weight="800" letter-spacing="6">R2D2</text>
    <text x="98" y="244" fill="#fff9e8" font-family="'JetBrains Mono', Consolas, monospace" font-size="20" font-weight="700" letter-spacing="5">LOCAL-FIRST AI AGENT</text>
    <text x="98" y="284" fill="#d9c7f2" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="17">Any LLM. Real tools. Sub-agents. A voice. Human approvals.</text>

    <g transform="translate(98 306)">
      <rect width="150" height="38" rx="19" fill="#160f38" fill-opacity=".78" stroke="#d34cff" stroke-opacity=".72"/>
      <circle cx="20" cy="19" r="5" fill="#d952ff" filter="url(#glow)"><animate attributeName="opacity" values=".3;1;.3" dur="1.4s" repeatCount="indefinite"/></circle>
      <text x="34" y="24" fill="#f0d7ff" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" letter-spacing="1.2">FASTAPI CORE</text>
    </g>
    <g transform="translate(262 306)">
      <rect width="150" height="38" rx="19" fill="#1d1732" fill-opacity=".78" stroke="#f3c454" stroke-opacity=".65"/>
      <text x="20" y="24" fill="#ffe7a2" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" letter-spacing="1.2">REACT COCKPIT</text>
    </g>
    <g transform="translate(426 306)">
      <rect width="170" height="38" rx="19" fill="#0f1a3a" fill-opacity=".78" stroke="#5fc8ff" stroke-opacity=".66"/>
      <text x="20" y="24" fill="#cdeeff" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" letter-spacing="1.2">HUMAN-IN-THE-LOOP</text>
    </g>

    <rect x="0" y="0" width="1200" height="420" rx="34" fill="none" stroke="url(#gold)" stroke-width="2"/>
    <rect x="10" y="10" width="1180" height="400" rx="27" fill="none" stroke="#c44fff" stroke-opacity=".16"/>
    <rect x="0" y="-45" width="1200" height="34" fill="#f7cf68" opacity=".045"><animate attributeName="y" values="-45;450" dur="8s" repeatCount="indefinite"/></rect>
  </g>
</svg>
